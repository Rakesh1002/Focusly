name: CI

on:
  push:
    branches:
      - main
      - 'focusly-ai*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test
