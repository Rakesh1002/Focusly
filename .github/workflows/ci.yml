name: CI

on:
  push:
    branches:
      - main
      - 'focusly-ai*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 15

    env:
      XCODE_VERSION: '15.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test
