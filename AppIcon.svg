<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2F"/>
      <stop offset="1" stop-color="#0D0D10"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824pt tile centred on the 1024 canvas -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
  <circle cx="512" cy="512" r="236" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="46"/>
  <!-- 70% progress arc from twelve o'clock -->
  <circle cx="512" cy="512" r="236" fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"
          stroke-dasharray="1038.0 444.9" transform="rotate(-90 512 512)"/>
  <circle cx="512" cy="512" r="50" fill="#FFFFFF"/>
</svg>
